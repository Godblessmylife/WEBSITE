<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>Future3D — JavaScript разработчик</title>
    <meta
      name="description"
      content="Разработка сайтов, игр, 3D. JavaScript-разработчик: реалистичная 3D-графика, интерактив и запоминающийся пользовательский опыт вместо шаблонных лендингов."
    />
    <link rel="canonical" href="https://3dfuturistic.ru/" />

    <!-- Favicon: SVG для современных браузеров (масштабируется без потерь),
         PNG - фолбэк там, где SVG-иконки не поддерживаются. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Установка на рабочий стол (PWA) - iOS Safari не читает манифест
         для part управления видом standalone-режима, нужны отдельные
         apple-* мета-теги. Android/Chrome берут это из site.webmanifest
         (display: standalone) - им эти теги не нужны, но не мешают. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Future3D" />

    <!-- Open Graph - превью при отправке ссылки в Telegram/соцсетях
         (картинка + заголовок + описание вместо голой ссылки). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://3dfuturistic.ru/" />
    <meta property="og:title" content="Future3D — JavaScript разработчик" />
    <meta
      property="og:description"
      content="Разработка сайтов, игр, 3D. Сайты и 3D-сцены, которые запоминаются с первой секунды."
    />
    <meta property="og:image" content="https://3dfuturistic.ru/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter/X читает свои теги, если открыть OG отдельно - на всякий
         случай дублируем summary_large_image (та же картинка). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Future3D — JavaScript разработчик" />
    <meta
      name="twitter:description"
      content="Разработка сайтов, игр, 3D. Сайты и 3D-сцены, которые запоминаются с первой секунды."
    />
    <meta name="twitter:image" content="https://3dfuturistic.ru/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
